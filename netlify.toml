[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API 代理: 前端不携带 token, 由服务端函数注入鉴权
[[redirects]]
  from = "/notion-api/*"
  to = "/.netlify/functions/notion-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
